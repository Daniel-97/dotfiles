general {
    lock_cmd = noctalia msg session lock              # Noctalia gestisce la lockscreen
    before_sleep_cmd = loginctl lock-session          # lock prima della sospensione
    after_sleep_cmd = hyprctl dispatch dpms on        # evita di dover premere due volte un tasto
}

listener {
    timeout = 150                                     # 2.5min.
    on-timeout = brightnessctl -s set 10              # retroilluminazione al minimo
    on-resume = brightnessctl -r                      # ripristina
}

# Tastiera retroilluminata: commenta se non presente.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 300                                     # 5min
    on-timeout = loginctl lock-session                # lockscreen Noctalia
}

listener {
    timeout = 330                                     # 5.5min
    on-timeout = hyprctl dispatch dpms off            # schermo spento
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                                    # 30min
    on-timeout = systemctl suspend
}
